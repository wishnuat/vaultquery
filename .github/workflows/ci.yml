name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend (embedded by the Rust crate)
        run: npm run build
      - name: Engine tests (unit + format fixtures)
        working-directory: src-tauri
        run: cargo test --locked

  release:
    # Push a tag like v0.2.0 to build the installer and attach it to a draft GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VaultQuery ${{ github.ref_name }}
          releaseBody: See the README for what's new. The installer is not code-signed yet, so Windows SmartScreen may warn on first run.
          releaseDraft: true
