[package]
name = "vaultquery"
version = "0.2.0"
description = "Fast content search inside Excel, Word, PDF, CSV and zip files - no index"
authors = ["wishnuat"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vaultquery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.1"
rayon = "1.12.0"
regex = "1.13.2"
calamine = "0.38.0"
pdf-extract = "0.12.1"
tauri-plugin-dialog = "2.8.4"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"  # keep unwind: a crashing PDF parser must not kill the app
strip = true

